><stop offset="1" stop-color="#f3efe6" stop-opacity=".92"/></linearGradient></defs><path d="M360.8 397.8C337.6 484.8 326 554.4 326 612.4Q500 676.2 674 612.4C674 554.4 662.4 484.8 639.2 397.8Z" fill="url(#dr7)"/><path d="M404.3 597.9Q447.8 522.5 430.4 464.5M595.7 597.9Q552.2 522.5 569.6 464.5" stroke="#000" stroke-opacity=".07" stroke-width="10.2" fill="none" stroke-linecap="round"/><path d="M326 612.4Q500 676.2 674 612.4" stroke="#000" stroke-opacity=".1" stroke-width="3" fill="none"/><path d="M320.2 537Q291.2 125.2 500 125.2Q708.8 125.2 679.8 537Q500 571.8 320.2 537Z" fill="#f3efe6"/><ellipse cx="500" cy="313.7" rx="104.4" ry="136.3" fill="#e4b49a"/><path d="M384 270.2Q500 107.8 616 270.2" stroke="#f3efe6" stroke-width="58" fill="none"/><circle cx="462.3" cy="299.2" r="10.2" fill="#3a2a22"/><circle cx="537.7" cy="299.2" r="10.2" fill="#3a2a22"/><path d="M471 377.5q29 23.2 58 0" stroke="#a0524a" stroke-width="3" fill="none"/><g transform="translate(500 142.6)"><path d="M-217.5 0L0 -69.6L217.5 0L0 69.6z" fill="#141a2e"/><rect x="-98.6" y="14.5" width="197.2" height="63.8" rx="4" fill="#141a2e"/><g class="swing" style="transform-origin:0px 0px"><path d="M0 0L174 34.8V145" stroke="#d4af37" stroke-width="4" fill="none"/><rect x="162.4" y="139.2" width="10" height="46.4" fill="#d4af37"/></g></g></g></g><g class="fx"><g class="drift" style="animation-duration:30s;animation-delay:0s"><g transform="translate(0 80) scale(0.7)"><ellipse cx="60" cy="20" rx="70" ry="26" fill="#fff" opacity=".85"/><ellipse cx="110" cy="8" rx="48" ry="30" fill="#fff" opacity=".85"/></g></g><g class="drift" style="animation-duration:39s;animation-delay:-11s"><g transform="translate(0 150) scale(1.1)"><ellipse cx="60" cy="20" rx="70" ry="26" fill="#fff" opacity=".85"/><ellipse cx="110" cy="8" rx="48" ry="30" fill="#fff" opacity=".85"/></g></g><g class="drift" style="animation-duration:48s;animation-delay:-22s"><g transform="translate(0 220) scale(0.7)"><ellipse cx="60" cy="20" rx="70" ry="26" fill=