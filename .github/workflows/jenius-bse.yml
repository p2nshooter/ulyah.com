name: jenius.es BSE (buku pelajaran SD/MI–SMK/MAK)

# Pemilik, 9 Nov 2026: „buku pelajaran dari SD, MI, SMP, Tsanawiyah, SMA, MA, SMK, MAK sampe ke Perguruan tinggi“.
# Mengonversi Buku Sekolah Elektronik 2008–2011 (jenius/data/bse.json, dari indeks CC BY github.com/Hans5958/Indeks-BSE)
# menjadi buku bersuara di jenius.es: PDF → pdftotext → bab → POST /api/ops/book (jenius/scripts/bse/run.mjs). Setiap PDF
# hanya diimpor bila halaman hak ciptanya memuat izin „diunduh, digandakan, dicetak, dialihmediakan“.
# Kunci ops acak sekali pakai; hanya hash-nya yang ditulis ke R2 (k/ops-bse.json) lalu dibatalkan di akhir.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Jumlah buku per putaran'
        default: '20'
      dry:
        description: 'Uji kering (tanpa unggah): true/false'
        default: 'false'
      ids:
        description: 'Id tertentu (pisah koma), opsional'
        default: ''
      debug:
        description: 'Cetak diagnosis teks PDF: true/false'
        default: 'false'

concurrency:
  group: jenius-bse
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: jenius
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: One-time ops key (hash to R2)
        if: github.event.inputs.dry != 'true'
        run: |
          set -eu
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          echo "OPS_KEY=$KEY" >> "$GITHUB_ENV"
          printf '{"hash":"%s","at":%s}' "$(printf %s "$KEY" | sha256sum | cut -d' ' -f1)" "$(date +%s%3N)" > /tmp/ops.json
          npx wrangler r2 object put jenius-data/k/ops-bse.json --file /tmp/ops.json --content-type application/json --remote >/dev/null
      - name: Convert and upload
        env:
          IN_LIMIT: ${{ github.event.inputs.limit || '20' }}
          IN_DRY: ${{ github.event.inputs.dry || 'false' }}
          IN_IDS: ${{ github.event.inputs.ids || '' }}
          IN_DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: |
          set -eu
          # Masukan workflow lewat env dan diperiksa bentuknya (tanpa menyisipkannya langsung ke skrip).
          [[ "$IN_LIMIT" =~ ^[0-9]{1,3}$ ]] || { echo "::error::limit tidak sah"; exit 1; }
          [[ -z "$IN_IDS" || "$IN_IDS" =~ ^[0-9,]{1,400}$ ]] || { echo "::error::ids tidak sah"; exit 1; }
          set -- --url https://jenius.es --limit "$IN_LIMIT"
          [ "$IN_DRY" = "true" ] && set -- "$@" --dry
          [ -n "$IN_IDS" ] && set -- "$@" --ids "$IN_IDS"
          [ "$IN_DEBUG" = "true" ] && set -- "$@" --debug
          node scripts/bse/run.mjs "$@"
      - name: Revoke the ops key
        if: always() && github.event.inputs.dry != 'true'
        run: |
          printf '{"hash":"%s","at":%s}' "$(openssl rand -hex 32)" "$(date +%s%3N)" > /tmp/ops.json
          npx wrangler r2 object put jenius-data/k/ops-bse.json --file /tmp/ops.json --content-type application/json --remote >/dev/null || true
