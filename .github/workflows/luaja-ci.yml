name: luaja.com CI

# Uji folder `luaja/` (LUAJA): tipe, unit (AdSense tumpuk, skema & mutu pelajaran, bank soal, penilaian, harga/promo,
# tagihan, R2 store) dan ujung-ke-ujung di Chromium sungguhan (desktop + ponsel) terhadap `wrangler dev`.

on:
  pull_request:
    paths:
      - 'luaja/**'
      - 'adsense-stack.json'
      - '.github/workflows/luaja-ci.yml'
      - '.github/workflows/deploy-luaja.yml'
  push:
    branches: [main]
    paths:
      - 'luaja/**'

concurrency:
  group: luaja-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-24.04: pada ubuntu-latest (26.04) `playwright install --with-deps` gagal.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: luaja
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: End-to-end
        run: bash test/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luaja-e2e
          path: luaja/e2e-out
          retention-days: 7
