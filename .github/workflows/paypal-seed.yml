name: Seed PayPal credentials (xscan.es)

# Menanam Client ID + Secret PayPal awal ke Worker `detektor-artikel` sebagai secret `PAYPAL_SEED`
# (MASTER-BLUEPRINT §28.4). Repositori ini PUBLIK, jadi masukan alur kerja ini HANYA menerima teks yang sudah
# dienkripsi untuk Worker tersebut (format `ecies1.…`, dibuat dengan kunci publik dari /api/paypal/seed-key —
# lihat detektor-artikel/scripts/seal-paypal-seed.mjs). Teks asli kredensial tidak pernah lewat GitHub; hanya Worker
# (kunci privatnya disegel MASTER_KEY di R2) yang bisa membukanya. Setelah tertanam, kredensial dikelola di
# Admin → PayPal (ubah / hapus); seed yang sama tidak pernah ditanam ulang dan tidak pernah menimpa isi admin.

on:
  workflow_dispatch:
    inputs:
      sealed:
        description: 'Seed terenkripsi (ecies1.…) — BUKAN client ID/secret asli. Kosongkan untuk hanya menampilkan kunci publik Worker.'
        required: false
        type: string

concurrency:
  group: deploy-detektor-artikel
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detektor-artikel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Print the Worker's public seed key (when no seed is given)
        id: key
        run: |
          set -eu
          SEED=$(jq -r '.inputs.sealed // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$SEED" ]; then echo "mode=seed" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "mode=key" >> "$GITHUB_OUTPUT"
          for host in https://xscan.es https://detektor-artikel.axto.workers.dev; do
            key=$(curl -sf "$host/api/paypal/seed-key" || true)
            if printf '%s' "$key" | jq -e '.kty == "EC" and .crv == "P-256"' >/dev/null 2>&1; then
              echo "SEED_PUBLIC_KEY=$key"
              { echo "## Kunci publik seed PayPal ($host)"; echo '```json'; echo "$key"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::Kunci publik tidak bisa diambil dari situs live."; exit 1

      - name: Validate the sealed seed (never plaintext)
        if: steps.key.outputs.mode == 'seed'
        run: |
          set -eu
          SEED=$(jq -r '.inputs.sealed // empty' "$GITHUB_EVENT_PATH")
          if ! printf '%s' "$SEED" | grep -Eq '^ecies1\.[A-Za-z0-9_-]+~[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{16}\.[A-Za-z0-9_-]{40,}$'; then
            echo "::error::Masukan bukan seed terenkripsi ecies1.… — kredensial asli tidak boleh dikirim lewat GitHub."
            exit 1
          fi
          printf '%s' "$SEED" > "$RUNNER_TEMP/seed.txt"

      - name: Install dependencies
        if: steps.key.outputs.mode == 'seed'
        run: npm ci

      - name: Resolve KV namespace id for wrangler config
        if: steps.key.outputs.mode == 'seed'
        run: |
          set -eu
          KV_ID=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title=="detektor-rl") | .id' | head -n1)
          [ -n "$KV_ID" ] || { echo "::error::KV detektor-rl belum ada — jalankan deploy dulu"; exit 1; }
          sed -i "s/__KV_NAMESPACE_ID__/${KV_ID}/" wrangler.jsonc

      - name: Put PAYPAL_SEED secret
        if: steps.key.outputs.mode == 'seed'
        run: |
          set -eu
          npx wrangler secret put PAYPAL_SEED < "$RUNNER_TEMP/seed.txt" >/dev/null
          rm -f "$RUNNER_TEMP/seed.txt"
          echo "PAYPAL_SEED: dipasang (terenkripsi)."

      - name: Test the credentials and register the webhook automatically
        if: steps.key.outputs.mode == 'seed'
        run: |
          set -eu
          # Hanya berhasil/gagal + pesan PayPal yang dicetak — tidak pernah kredensial.
          for host in https://xscan.es https://detektor-artikel.axto.workers.dev; do
            for i in $(seq 1 8); do
              sleep 8
              out=$(curl -s -X POST "$host/api/paypal/check" || true)
              if printf '%s' "$out" | jq -e '.mode' >/dev/null 2>&1; then
                echo "$host → $(printf '%s' "$out" | jq -c '{enabled, mode, ready, pendingActivate, sandbox: (.sandbox | if . then {ok, msg} else null end), live: (.live | if . then {ok, msg} else null end)}')"
                { echo "## Uji koneksi PayPal ($host)"; echo '```json'; printf '%s' "$out" | jq '{enabled, mode, ready, pendingActivate, sandbox: (.sandbox | if . then {ok, msg} else null end), live: (.live | if . then {ok, msg} else null end)}'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done
          done
          echo "::warning::Uji koneksi PayPal belum bisa dipanggil — periksa Admin → PayPal."

      - name: Check PayPal status on the live site
        if: steps.key.outputs.mode == 'seed'
        run: |
          set -eu
          for host in https://xscan.es https://detektor-artikel.axto.workers.dev; do
            for i in $(seq 1 10); do
              st=$(curl -sf "$host/api/health" | jq -r '.paypal // empty' 2>/dev/null || true)
              [ "$st" = "ready" ] && break
              sleep 6
            done
            echo "$host → paypal: ${st:-tidak terbaca}"
            [ "$st" = "ready" ] && { echo "## PayPal siap di $host ✅" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          done
          echo "::warning::Seed terpasang, tetapi status PayPal belum 'ready' — periksa Admin → PayPal."
