name: Deploy luaja.com (LUAJA)

# Worker `luaja-com` (folder `luaja/`): kursus bahasa Jerman, Inggris, Jepang, TOEFL & IELTS (docs/LUAJA-BLUEPRINT.md).
# Aturan tetap pemilik: SEMUA data di R2 (luaja-data; berkas di luaja-media; cadangan di luaja-backups) — tidak pernah D1.
# KV hanya untuk penghitung batas laju.
#
# - Bucket R2 dan namespace KV dibuat sendiri bila belum ada.
# - luaja.com (+ www) dipasang sebagai custom domain lewat API begitu zonanya aktif; record A/AAAA/CNAME lama yang
#   menghalangi dicatat di ringkasan run untuk dihapus pemilik. Alamat kanonik baru dipasang setelah domain menjawab; sebelum itu
#   situs online di https://luaja-com.<subdomain>.workers.dev (noindex).
# - SESSION_SECRET dibuat acak SEKALI bila belum ada dan tidak pernah diganti oleh deploy berikutnya.
# - Jadwal harian ikut menjalankan deploy agar luaja.com langsung terpasang begitu zonanya aktif.
# - AdSense: akun utama + tumpukan dari adsense-stack.json; uji asap menolak deploy yang ads.txt, tag meta, atau loadernya
#   berbeda dari file itu.

on:
  push:
    branches: [main]
    paths:
      - 'luaja/**'
      - 'adsense-stack.json'
      - '.github/workflows/deploy-luaja.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: deploy-luaja
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  DOMAIN: luaja.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: luaja
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Cloudflare secrets are present
        run: |
          set -eu
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Secret GitHub yang belum diisi:$missing"; exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Type check & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Self-provision R2 buckets & KV if missing
        run: |
          set -eu
          CF="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          JSON="Content-Type: application/json"
          show_err() { echo "$1" | jq -r '.errors[]? | "  CF error \(.code): \(.message)"' 2>/dev/null || true; }
          for b in luaja-data luaja-media luaja-backups; do
            have=$(curl -s -H "$AUTH" "$CF/r2/buckets/$b" | jq -r '.success' 2>/dev/null || echo false)
            if [ "$have" = "true" ]; then echo "R2 $b: ada"; continue; fi
            resp=$(curl -s -X POST -H "$AUTH" -H "$JSON" -d "{\"name\":\"$b\"}" "$CF/r2/buckets")
            if [ "$(echo "$resp" | jq -r '.success')" = "true" ]; then echo "R2 $b: dibuat"; else
              show_err "$resp"; echo "::error::Tidak bisa membuat bucket R2 $b (token perlu 'Account > Workers R2 Storage : Edit')"; exit 1; fi
          done
          KV_RESP=$(curl -s -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100")
          KV_ID=$(echo "$KV_RESP" | jq -r '.result[]? | select(.title=="luaja-rl") | .id' | head -n1)
          if [ -z "$KV_ID" ]; then
            KV_CREATE=$(curl -s -X POST -H "$AUTH" -H "$JSON" -d '{"title":"luaja-rl"}' "$CF/storage/kv/namespaces")
            KV_ID=$(echo "$KV_CREATE" | jq -r '.result.id // empty')
            [ -z "$KV_ID" ] && { show_err "$KV_CREATE"; echo "::error::Tidak bisa membuat KV luaja-rl"; exit 1; }
          fi
          echo "KV id: $KV_ID"
          sed -i "s/__KV_NAMESPACE_ID__/${KV_ID}/" wrangler.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy | tee deploy.log

      # Domain dipasang lewat API (bukan routes wrangler) agar penyebab kegagalan terbaca. Bila apex/www masih punya record
      # A/AAAA/CNAME lama (Cloudflare 100117), record itu dicatat di ringkasan run — tidak dihapus otomatis; pemilik
      # menghapusnya sekali di dasbor Cloudflare. Alamat kanonik baru dipasang setelah apex benar-benar tersambung,
      # sehingga workers.dev tidak pernah dialihkan ke domain yang belum menjawab.
      - name: Attach luaja.com (+ www) when its zone is active
        run: |
          set -eu
          CF="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          JSON="Content-Type: application/json"
          ZONE_RESP=$(curl -s --max-time 20 -H "$AUTH" "$CF/zones?name=${DOMAIN}")
          if [ "$(echo "$ZONE_RESP" | jq -r '.success')" != "true" ]; then
            echo "$ZONE_RESP" | jq -r '.errors[]? | "  CF error \(.code): \(.message)"' || true
            echo "::warning::Token tidak bisa membaca zona ${DOMAIN}. Situs tetap online di workers.dev."
            echo "ZONE_STATUS=token tanpa akses zona" >> "$GITHUB_ENV"; exit 0
          fi
          ZONE_ID=$(echo "$ZONE_RESP" | jq -r '.result[0]?.id // empty')
          ZONE_STATUS=$(echo "$ZONE_RESP" | jq -r '.result[0]?.status // empty')
          echo "ZONE_STATUS=${ZONE_STATUS:-belum ada}" >> "$GITHUB_ENV"
          if [ -z "$ZONE_ID" ]; then echo "::warning::Zona ${DOMAIN} belum ada di akun ini. Situs tetap online di workers.dev."; exit 0; fi
          if [ "$ZONE_STATUS" != "active" ]; then
            NS=$(echo "$ZONE_RESP" | jq -r '.result[0].name_servers // [] | join(", ")')
            echo "::warning::Zona ${DOMAIN} berstatus '${ZONE_STATUS}'. Arahkan nameserver ke: ${NS}."; exit 0
          fi
          attach() { curl -s --max-time 30 -X PUT -H "$AUTH" -H "$JSON" -d "{\"zone_id\":\"$ZONE_ID\",\"hostname\":\"$1\",\"service\":\"luaja-com\",\"environment\":\"production\"}" "$CF/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"; }
          apex_ok=no; blocked=""
          for host in "${DOMAIN}" "www.${DOMAIN}"; do
            resp=$(attach "$host"); ok=$(echo "$resp" | jq -r '.success'); code=$(echo "$resp" | jq -r '.errors[0].code // 0')
            if [ "$ok" != "true" ] && [ "$code" = "100117" ]; then
              # Record A/AAAA/CNAME lama menghalangi. Tidak dihapus otomatis (perubahan DNS = keputusan pemilik): dicatat saja.
              recs=$(curl -s --max-time 20 -H "$AUTH" "$CF/zones/$ZONE_ID/dns_records?name=$host&per_page=50" | jq -r '.result[]? | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | "- \(.type) \(.name) → \(.content)"')
              { echo "### Record DNS lama yang menghalangi \`$host\`"; echo "$recs"; } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "$host -> luaja-com: success=$ok $(echo "$resp" | jq -c '.errors')"
            if [ "$ok" = "true" ]; then [ "$host" = "${DOMAIN}" ] && apex_ok=yes; else blocked="$blocked $host"; fi
          done
          if [ -n "$blocked" ]; then
            {
              echo "## ⚠️ Belum tersambung:$blocked"
              echo ""
              echo "Hapus sekali record A/AAAA/CNAME lama untuk host tersebut di Cloudflare → ${DOMAIN} → DNS (MX/TXT biarkan), lalu jalankan ulang workflow ini — atau beri token izin **Zone → DNS → Edit** agar workflow membersihkannya sendiri."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Belum tersambung:$blocked — lihat ringkasan run."
          fi
          if [ "$apex_ok" = "yes" ]; then
            echo "PUBLIC_URL=https://${DOMAIN}" >> "$GITHUB_ENV"
            echo "ATTACHED=yes" >> "$GITHUB_ENV"
          fi

      - name: Set canonical host after the domain answers
        if: env.ATTACHED == 'yes'
        run: npx wrangler deploy --var "CANONICAL_HOST:${DOMAIN}" | tee -a deploy.log

      - name: Create SESSION_SECRET and MASTER_KEY once (never rotated by deploys)
        run: |
          set -eu
          have=$(npx wrangler secret list --format json 2>/dev/null | jq -r '.[].name' || true)
          for name in SESSION_SECRET MASTER_KEY; do
            if echo "$have" | grep -qx "$name"; then echo "$name: sudah ada (tidak diubah)"; continue; fi
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put "$name" >/dev/null
            echo "$name: dibuat"
          done

      - name: Smoke test
        run: |
          set -eu
          WORKERS_URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          URL="${PUBLIC_URL:-$WORKERS_URL}"
          [ -n "$URL" ] || { echo "::error::URL tidak ditemukan di log deploy"; exit 1; }
          # Setiap curl berbatas waktu: sertifikat domain baru bisa butuh beberapa menit, uji tidak boleh menggantung.
          C="curl -sf --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors"
          for i in $(seq 1 40); do curl -sf --max-time 10 "$URL/api/health" >/dev/null && break; sleep 6; done
          $C "$URL/api/health"; echo
          STACK="$GITHUB_WORKSPACE/adsense-stack.json"
          PRIMARY=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).primary["luaja.com"])' "$STACK")
          want=$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const a=[...new Set([s.primary["luaja.com"],...s.stack])];process.stdout.write(a.map(c=>"google.com, "+c.replace(/^ca-/,"")+", DIRECT, f08c47fec0942fa0").join("\n"))' "$STACK")
          ads=$($C "$URL/ads.txt")
          [ "$ads" = "$want" ] || { echo "::error::ads.txt salah (harus $(echo "$want" | wc -l) baris dari adsense-stack.json)"; exit 1; }
          echo "ads.txt: $(echo "$ads" | wc -l) baris ✅"
          $C -L "$URL/" -o home.html
          n=0
          for c in $(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log([...new Set([s.primary["luaja.com"],...s.stack])].join(" "))' "$STACK"); do
            grep -q "name=\"google-adsense-account\" content=\"$c\"" home.html || { echo "::error::tag meta AdSense $c hilang"; exit 1; }
            n=$((n + 1))
          done
          [ "$(grep -o 'adsbygoogle.js?client=' home.html | wc -l)" = "1" ] || { echo "::error::harus tepat satu loader AdSense"; exit 1; }
          grep -q "adsbygoogle.js?client=${PRIMARY}" home.html || { echo "::error::loader AdSense ${PRIMARY} hilang"; exit 1; }
          grep -q '<html lang="id"' home.html || { echo "::error::beranda tidak tampil"; exit 1; }
          node scripts/robots-check.mjs "$URL/robots.txt" || { echo "::error::robots.txt menutup crawler Google"; exit 1; }
          $C "$URL/sitemap.xml" | grep -q '<urlset' || { echo "::error::sitemap.xml tidak ada"; exit 1; }
          $C "$URL/manifest.webmanifest" | grep -q '"standalone"' || { echo "::error::manifest PWA tidak ada"; exit 1; }
          for p in /jerman /inggris /jepang /harga /coba /latihan /belajar/de-a1-m01-l01 /masuk /daftar /privasi /syarat /sw.js /assets/app.css /assets/app.js /favicon.svg; do
            $C -o /dev/null "$URL$p" || { echo "::error::$p gagal"; exit 1; }
          done
          # Kunci jawaban tidak pernah ikut terkirim ke peramban sebelum peserta selesai.
          if $C "$URL/belajar/de-a1-m01-l01" | grep -q '"answer"'; then echo "::error::kunci jawaban bocor ke halaman pelajaran"; exit 1; fi
          {
            echo "## luaja.com online"
            echo ""
            echo "- Situs: $URL"
            [ -n "$WORKERS_URL" ] && [ "$WORKERS_URL" != "$URL" ] && echo "- Alamat cadangan: $WORKERS_URL"
            echo "- Zona ${DOMAIN}: ${ZONE_STATUS}"
            echo "- AdSense: loader ${PRIMARY} + ${n} tag meta dan ${n} baris ads.txt dari adsense-stack.json ✅"
          } >> "$GITHUB_STEP_SUMMARY"
