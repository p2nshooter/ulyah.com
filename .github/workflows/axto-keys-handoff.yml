name: Serah-terima kunci API ke axto.io

# Pemilik, 24 Nov 2026: „Copy aja API GPU dari ulyah.com, biar ga terhubung ke ulyah.com" · „Ambil semua apinya yg
# aktif bukanya hanya GPU, siapa tau berguna". Semua kunci aktif kolam donasi dibuka di runner ini lalu langsung disegel
# ke kunci publik saluran privat axto.io → ulyah-media/axto-handoff/keys.sealed.json. Hanya axto.io yang bisa membukanya;
# log hanya berisi jumlah per penyedia. Berjalan saat skrip berubah, tiap hari (kunci donasi baru ikut), dan manual.
on:
  push:
    branches: [main]
    paths: ['scripts/axto-keys-handoff.mjs', '.github/workflows/axto-keys-handoff.yml']
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: axto-keys-handoff
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Segel kunci aktif untuk axto.io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY_ENCRYPTION_SECRET: ${{ secrets.KEY_ENCRYPTION_SECRET }}
        run: node scripts/axto-keys-handoff.mjs
