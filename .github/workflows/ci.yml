name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit i18n consistency (no sibling site left in the wrong language)
        run: npx tsx scripts/audit-i18n-consistency.ts

      # The Worker is capped at 3 MiB by Cloudflare and this table ships inside
      # it. Regenerating it for all 26 languages once took it from 471 KB to
      # 813 KB gzipped and the deploy was rejected outright — after the build
      # had already passed, so nothing caught it until production. This is the
      # cheap guard that would have.
      - name: Guard the bundled translation table's size
        run: |
          set -eu
          GZ=$(gzip -9c apps/web/src/lib/ui-i18n.gen.ts | wc -c)
          LIMIT=$((300 * 1024))
          echo "ui-i18n.gen.ts: $((GZ / 1024)) KiB gzipped (limit $((LIMIT / 1024)) KiB)"
          if [ "$GZ" -gt "$LIMIT" ]; then
            echo "::error::The bundled UI translation table is too large for the 3 MiB Worker limit."
            echo "It must carry only the languages actually served — see scripts/generate-ui-i18n.ts."
            exit 1
          fi

      # A visitor must land on the language the site actually serves. This got
      # it wrong in the direction nothing else can catch: Googlebot crawls from
      # US addresses with no cookie, so every bare ulyah.com url answered
      # 307 -> /en/..., a page we mark noindex on purpose. The site built,
      # typechecked and served fine — it was simply never indexed. Checked for
      # every tenant, because each one inlines its own locale list.
      - name: Check language detection (all five sites)
        run: |
          set -eu
          for t in ulyah dawa 1fr tilawa xad; do
            echo "--- $t ---"
            NEXT_PUBLIC_TENANT=$t pnpm check:locale
          done

      - name: Typecheck worker-api
        run: pnpm --filter @ulyah/worker-api typecheck

      - name: Typecheck web
        run: pnpm --filter @ulyah/web typecheck

      - name: Build web (Next.js)
        run: pnpm --filter @ulyah/web build
        env:
          NEXT_PUBLIC_API_URL: https://api.ulyah.com
