name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two checks were written in a scratch directory and copied in with their
      # imports still absolute. They passed locally every time and failed CI
      # twice, for a reason unrelated to the commit. First, because everything
      # after it is pointless if the scripts cannot load.
      - name: Check no script imports by absolute path
        run: node scripts/check-no-absolute-imports.mjs

      - name: Audit i18n consistency (no sibling site left in the wrong language)
        run: npx tsx scripts/audit-i18n-consistency.ts

      # The Worker is capped at 3 MiB by Cloudflare and this table ships inside
      # it. Regenerating it for all 26 languages once took it from 471 KB to
      # 813 KB gzipped and the deploy was rejected outright — after the build
      # had already passed, so nothing caught it until production. This is the
      # cheap guard that would have.
      - name: Guard the bundled translation table's size
        run: |
          set -eu
          GZ=$(gzip -9c apps/web/src/lib/ui-i18n.gen.ts | wc -c)
          LIMIT=$((300 * 1024))
          echo "ui-i18n.gen.ts: $((GZ / 1024)) KiB gzipped (limit $((LIMIT / 1024)) KiB)"
          if [ "$GZ" -gt "$LIMIT" ]; then
            echo "::error::The bundled UI translation table is too large for the 3 MiB Worker limit."
            echo "It must carry only the languages actually served — see scripts/generate-ui-i18n.ts."
            exit 1
          fi

      # A visitor must land on the language the site actually serves. This got
      # it wrong in the direction nothing else can catch: Googlebot crawls from
      # US addresses with no cookie, so every bare ulyah.com url answered
      # 307 -> /en/..., a page we mark noindex on purpose. The site built,
      # typechecked and served fine — it was simply never indexed. Checked for
      # every tenant, because each one inlines its own locale list.
      - name: Check language detection (all five sites)
        run: |
          set -eu
          for t in ulyah dawa 1fr tilawa xad; do
            echo "--- $t ---"
            NEXT_PUBLIC_TENANT=$t pnpm check:locale
          done

      # One url per page across the five sites, and an hreflang graph that
      # points both ways. Non-reciprocal hreflang is discarded silently, and a
      # page reachable at two urls splits its own ranking — neither shows up in
      # a build or a typecheck.
      - name: Check canonical urls and hreflang reciprocity
        run: pnpm check:urls

      # The warm job translates through 595 donated keys, and its failure modes
      # are all quiet ones: a model that merges two lines pairs every following
      # translation to the wrong source, and a language the prompt cannot name
      # is answered confidently in the wrong one. Neither shows up in a build.
      # Runs with fetch stubbed, so it needs no key and no network.
      - name: Check the translation pool's failover logic
        run: pnpm check:translate

      # A warm run that translates nothing and exits 0 is indistinguishable
      # from a corpus that was already finished, so the parity arithmetic that
      # decides "is there work here" gets its own check.
      - name: Check the warm job's parity decision
        run: node scripts/check-warm-parity.mjs

      # Hand-written translations are stored under a key derived from the text.
      # The Worker derives it in mt.ts; scripts/mt-key.mjs derives it again so
      # translations can be written offline. If the two ever disagree the Worker
      # looks up keys nobody wrote, every affected page quietly falls back to
      # English, and nothing anywhere reports a problem.
      - name: Check the translation key still matches the Worker's
        run: node scripts/check-mt-key.mjs

      # A title can be translated, spelled correctly and committed, and still
      # never reach a reader — if it was filed under a key the Worker does not
      # ask for. Counting rows would not notice; deriving every expected key
      # and looking for it does.
      - name: Check every story title has all three languages
        run: node scripts/check-translation-coverage.mjs

      # 232 Spanish rows had the Arabic matn of a hadith replaced with a Spanish
      # pious phrase, because the translator recognised it and rendered it. No
      # prompt binds gtx and the on-demand path uses it, so the guarantee has to
      # be structural: hide the script, translate, put it back.
      - name: Check Arabic scripture survives translation untouched
        run: node scripts/check-arabic-preserved.mjs

      # The same guarantee end to end, against a translator written to destroy
      # scripture. If masking ever stops covering the whole path, this fails
      # before a single hadith is mangled in production.
      - name: Check a hadith survives a hostile translator
        run: node scripts/check-scripture-survives.mjs

      # Concurrency has two silent failures: a translation paired to the wrong
      # paragraph reads perfectly, and two workers sharing a key make 489 keys
      # behave like a handful. Both are asserted here.
      - name: Check parallel translation keeps order and key isolation
        run: npx tsx scripts/check-parallel-translate.mjs

      # Six letters never join to what follows them, and that rule is the whole
      # of the second Iqro level. The generator did not know it, so drills that
      # do not touch were shown as joined.
      - name: Check the Iqro drills respect huruf sambung
        run: npx tsx scripts/check-iqro-joining.mjs

      # Bulughul Maram and Arba'in are filled from the hadith corpus by matching
      # Arabic, not by translating. A wrong pairing would put a real, fluent,
      # wrong terjemah under a hadith — invisible to anyone not reading Arabic.
      # So the matcher has to refuse boilerplate and refuse near misses.
      - name: Check the hadits matcher refuses anything but a certain match
        run: npx tsx scripts/check-hadits-matcher.mjs

      # The cleaner edits classical Arabic in place. Its first draft swallowed a
      # whole row after an unterminated `</span` — 268 rows of Sirah Ibnu Hisyam
      # would have been emptied. Every Arabic letter must survive the scrub.
      - name: Check the pesantren cleaner keeps every Arabic letter
        run: npx tsx scripts/check-pesantren-clean.mjs

      # The kitab terjemah now ends in "(HR. Bukhari no. 1)", and the sibling
      # sites get it through gtx — which renders "HR." as "recursos humanos" and
      # replaces Arabic with a pious phrase of its own. Both must be masked.
      - name: Check kitab citations survive translation to the sibling sites
        run: npx tsx scripts/check-pesantren-mask.mjs

      # A leaf that splits a matn in half loses the sentence and stops the
      # reciter mid-word, and a passage the pager cannot find would freeze the
      # page while the voice carried on.
      - name: Check the kitab leaves never split a passage
        run: npx tsx apps/web/src/lib/leaf.test.mjs

      - name: Typecheck worker-api
        run: pnpm --filter @ulyah/worker-api typecheck

      - name: Typecheck web
        run: pnpm --filter @ulyah/web typecheck

      - name: Build web (Next.js)
        run: pnpm --filter @ulyah/web build
        env:
          NEXT_PUBLIC_API_URL: https://api.ulyah.com
