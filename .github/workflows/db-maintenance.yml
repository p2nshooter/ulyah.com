name: D1 Maintenance (free space)

# The database filled up and stopped accepting writes.
#
# Cloudflare caps a D1 database at 500 MB on the Workers Free plan. ulyah-db
# reached 509.95 MB, and every write began failing — including the admin's own
# two-step verification, so the owner could not log in. Reads were unaffected,
# which is why the sites looked healthy while nothing could be saved.
#
# The jobs, all available by hand; the nightly schedule runs prune-mt-ar and
# then the spill, in that order, so the space is free before anything needs to
# write into it:
#
#   prune-logs   deletes old key-pool validation rows. Pure churn, no content.
#   move-bodies  moves story bodies to R2 and leaves the key in D1.
#   prune-mt-ar  deletes machine translations made FROM Arabic — 69% of the
#                cache, and wrong: "عن أبي ذر" came out as "atas wewenang Abu
#                Dzar", "أم القرآن" as "Bunda Al-Qur'an". The reader falls back
#                to the curated hadits.text_id / text_en, which are sourced.
#                See scripts/prune-mt-arabic.ts for why this is a content fix
#                first and a space fix second.
#   prune-mt-off deletes machine translations INTO languages the ecosystem no
#                longer serves. Each site is written in one language — ulyah.com
#                Indonesian, the siblings their own — so only id/en/de/es/fr
#                rows are ever read now; the other twenty-four languages are
#                dead rows in the one place we cannot afford to run out of.
#
# And the size: every run ends by measuring the whole database file against two
# lines (owner: "pastikan database di bawah 10gb, sekitar 5gb saja") — a warning
# past the 5 GB target, a red run past the 10 GB ceiling. A full D1 is otherwise
# discovered by a locked-out admin login rather than by a workflow.
#
# D1 writes go through wrangler here rather than through the dashboard or an
# API client, because that is this repository's normal path for them and it
# leaves a run log of exactly what was executed.
on:
  # Automatic, because a full D1 does not degrade — it stops. Every write
  # fails, the admin cannot log in, and the only warning is a red line in a
  # dialog. Owner: "D1 di jadiin write awal, klo penuh pindahin ke R2, dan
  # ngebacanya dari R2, begitu seterusnya, jd D1 selalu luas."
  #
  # Daily at 00:20 UTC — twenty minutes after D1's daily quotas reset.
  #
  # It used to run at 19:40 UTC, which GitHub's scheduler routinely started at
  # 22:10-22:50: the END of the UTC day, by which time the Worker's own traffic
  # had spent the free plan's five million row reads. So every nightly run
  # failed on its first query — seven nights running (#64-#70), all with code
  # 7500 — and the prune that exists to keep the database under its 500 MB cap
  # never deleted a single row. The database filled; on 2026-09-27 the deploy
  # itself was refused with "Exceeded maximum DB size".
  #
  # A maintenance job that reads and deletes has to go FIRST in the quota day,
  # not last. Twenty minutes in leaves the reset time to settle and still runs
  # before the heartbeat and the sites have spent anything worth mentioning.
  #
  # A second, WEEKLY schedule runs the one task that cannot avoid a full scan of
  # mt_cache (the unserved-language prune: the target language sits in the
  # middle of the key, so no index range finds it). It found nothing for days
  # on end while costing a quarter of a million reads every night.
  schedule:
    - cron: "20 0 * * *"
    - cron: "40 0 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        required: true
        type: choice
        options: [spill, prune-logs, move-bodies, prune-mt-arabic, prune-mt-unserved, both, insights]
        default: spill
      budget:
        description: "Max rows to delete this run (free plan allows 100,000/day; the schedule splits it 40k+40k)"
        required: false
        default: "60000"
      limit:
        description: "How many story bodies to move this run"
        required: false
        default: "200"
      keep_days:
        description: "Days of key-validation log to keep"
        required: false
        default: "3"
      high_mb:
        description: "MB of story bodies in D1 that triggers a spill"
        required: false
        default: "40"
      low_mb:
        description: "MB to spill down to once triggered"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: db-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    # Above the 45-50 minute budget the spill and the mover hold themselves
    # to, so they stop and report rather than being killed mid-run. The first
    # full move was cancelled at exactly this cap and reported nothing.
    timeout-minutes: 70
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve provisioned resource IDs
        run: |
          set -eu
          CF="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          D1_ID=$(curl -sf -H "$AUTH" "$CF/d1/database?name=ulyah-db&per_page=100" | jq -r '.result[] | select(.name=="ulyah-db") | .uuid' | head -n1)
          KV_ID=$(curl -sf -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="ulyah-cache") | .id' | head -n1)
          sed -i "s/__D1_DATABASE_ID__/${D1_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__KV_NAMESPACE_ID__/${KV_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__R2_BUCKET_NAME__/ulyah-media/" apps/worker-api/wrangler.toml
          # The watermark reports the whole-file size alongside the bulk it
          # controls, and needs the id to ask for it.
          echo "D1_DATABASE_ID=${D1_ID}" >> "$GITHUB_ENV"

      # A DIAGNOSTIC, and diagnostics do not get to cancel the night's work.
      #
      # This printed a baseline and nothing else — and for at least three nights
      # running (#60, #61, #62) its failure took the whole job down with it:
      # every step after it was skipped, so prune-mt-arabic, prune-mt-unserved
      # and the R2 spill simply never ran. The database the owner asked to be
      # held near 5 GB was left to grow, and the run reported the failure of a
      # SELECT that prints a number, which reads like nothing important.
      #
      # `Size after` already carries this flag, with a comment explaining that
      # reporting is not worth failing a run that just freed space. The same is
      # true before, and more so: nothing has been freed yet.
      - name: Size before
        if: always()
        continue-on-error: true
        run: |
          cd apps/worker-api
          npx wrangler d1 execute ulyah-db --remote --command="SELECT 'stories' t, COUNT(*) n, ROUND(SUM(LENGTH(body))/1048576.0,1) mib FROM stories WHERE body <> '' UNION ALL SELECT 'key_validation_log', COUNT(*), NULL FROM key_validation_log;"

      # Every task below is INDEPENDENT of the ones before it, and says so with
      # `!cancelled()`: a step that fails — a quota refused, one table missing a
      # column — no longer skips the rest of the night. The whole point of the
      # job is that it frees what it can, every night, unattended. It still
      # stops the moment the run is cancelled.

      # Machine translations made from Arabic. This is the one step that frees
      # space by removing something that should never have been stored, so it
      # needs no R2 round trip first — there is nothing here worth keeping.
      #
      # It runs on the SCHEDULE too, and before the spill, because 310,731 rows
      # cannot go in one day: the free plan allows 100,000 row writes and a
      # delete is a write. The first run took 90,000 and left 220,731. A nightly
      # pass drains the rest in three more nights with nobody having to
      # remember, and the script's own budget stops before it eats the allowance
      # the spill and the sites' own writes need. Once the table is empty the
      # script says so and exits.
      - name: Delete machine translations made from Arabic
        if: ${{ !cancelled() && (github.event.schedule == '20 0 * * *' || inputs.job == 'prune-mt-arabic' || inputs.job == 'both') }}
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
        # 40,000 on the schedule, not 60,000: this now shares the day's
        # 100,000 row-write allowance with the unserved-language prune below.
        # Together they take 80,000 and leave the rest for the deploy's own
        # migration and for whatever the sites write while this runs. A manual
        # dispatch still gets the input's 60,000, because only one job runs then.
        run: npx tsx scripts/prune-mt-arabic.ts --budget=${{ inputs.budget || '40000' }}

      # Machine translations into languages nothing serves any more. Same
      # shape as the step above — bounded by the daily row-write allowance, run
      # on the schedule, drains over as many nights as it takes, and says so.
      - name: Delete machine translations into unserved languages
        if: ${{ !cancelled() && (github.event.schedule == '40 0 * * 0' || inputs.job == 'prune-mt-unserved' || inputs.job == 'both') }}
        run: npx tsx scripts/prune-mt-unserved.ts --budget=${{ inputs.budget || '40000' }}

      # The watermark: measure, and spill to R2 only if there is too much bulk
      # sitting in D1. This is the step the schedule exists for.
      - name: Spill to R2 if D1 is filling up
        if: ${{ !cancelled() && (github.event.schedule == '20 0 * * *' || inputs.job == 'spill') }}
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
        run: |
          npx tsx scripts/d1-watermark.ts \
            --high=${{ inputs.high_mb || '40' }} \
            --low=${{ inputs.low_mb || '15' }}

      # Old key-pool validation rows. This table records whether a donated API
      # key answered a test — useful for a few days, meaningless after that,
      # and it had grown to 35,049 rows. Deleting them frees pages immediately;
      # SQLite reuses freed pages, so writes start working again without the
      # file having to shrink.
      - name: Prune the key validation log
        if: ${{ !cancelled() && (inputs.job == 'prune-logs' || inputs.job == 'both') }}
        run: |
          cd apps/worker-api
          npx wrangler d1 execute ulyah-db --remote \
            --command="DELETE FROM key_validation_log WHERE created_at < datetime('now','-${{ inputs.keep_days }} days');"

      # Story bodies to R2. The script verifies every upload by reading it back
      # and comparing before it clears the column — see the note there.
      - name: Move story bodies to R2
        if: ${{ !cancelled() && (inputs.job == 'move-bodies' || inputs.job == 'both') }}
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
        run: npx tsx scripts/move-story-bodies-to-r2.ts --limit=${{ inputs.limit }} --minutes=50

      # `body_r2_key` only exists once migration 0054 has been applied, and the
      # deploy that applies it is itself blocked while D1 is full. Reporting is
      # not worth failing a run that just freed the space, so this step is
      # allowed to come back empty.
      - name: Size after
        if: always()
        continue-on-error: true
        run: |
          cd apps/worker-api
          npx wrangler d1 execute ulyah-db --remote --command="SELECT 'stories still in D1' t, COUNT(*) n, ROUND(SUM(LENGTH(body))/1048576.0,1) mib FROM stories WHERE body <> '';"
          # A key range, not LIKE: LIKE cannot use mt_cache's primary key and read
          # all ~247k rows to print this zero (see scripts/prune-mt-arabic.ts).
          # The unserved-language count needs a full scan, so it is reported by
          # the weekly prune itself rather than here every night.
          npx wrangler d1 execute ulyah-db --remote --command="SELECT 'mt from Arabic (should be 0)' t, COUNT(*) n FROM mt_cache WHERE k >= 'mt:ar-' AND k < 'mt:ar.';"

      # Which queries spent the day's reads. Cloudflare's GraphQL analytics, not
      # D1 itself, so it answers even after the five-million-row quota is gone
      # (code 7500) — which is exactly when the question matters. The free plan
      # shares that quota across every site on the account; this list is the
      # evidence for what to fix next (docs/ADSENSE-BLUEPRINT.md §12).
      - name: Top D1 queries by rows read (last 24 h)
        if: always()
        continue-on-error: true
        run: |
          cd apps/worker-api
          npx wrangler d1 insights ulyah-db --time-period=1d --sort-type=sum --sort-by=reads --limit=25 --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let a;try{a=JSON.parse(s)}catch{console.log(s);return}
                let total=0;for(const q of a)total+=Number(q.totalRowsRead??0);
                console.log(`rows read by the top ${a.length} queries in 24h: ${total.toLocaleString("en")}`);
                for(const q of a)console.log(String(q.totalRowsRead??"").padStart(12)+"  x"+String(q.numberOfTimesRun??"").padEnd(8)+" "+String(q.query??"").replace(/\s+/g," ").slice(0,220))})'
          npx wrangler d1 insights ulyah-db --time-period=1d --sort-type=sum --sort-by=writes --limit=10 --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let a;try{a=JSON.parse(s)}catch{console.log(s);return}
                console.log("--- top writers ---");
                for(const q of a)console.log(String(q.totalRowsWritten??"").padStart(12)+"  x"+String(q.numberOfTimesRun??"").padEnd(8)+" "+String(q.query??"").replace(/\s+/g," ").slice(0,220))})'

      # R2 against the 10 GB free tier (owner, 12 Oct: "turunkan R2-nya hingga
      # di bawah 10 GB"). The lifecycle rules the deploy installs do the
      # deleting; this is the nightly reading of where that stands.
      - name: R2 storage report
        if: always()
        continue-on-error: true
        run: |
          cd apps/worker-api
          for b in ulyah-media ulyah-next-cache; do
            npx wrangler r2 bucket info "$b" || true
            npx wrangler r2 bucket lifecycle list "$b" || true
          done

      # The size, LAST and never skipped: whatever the steps above did or did
      # not do, this is the number that decides whether the platform can still
      # write. Red run = act now; a warning annotation = past the target, so
      # decide what moves to R2 next; silence = there is room.
      #
      # The lines are the FREE plan's (400 MB target, 500 MB hard cap), because
      # that is the plan this account is on. Measured 2026-09-21: 0.47 GB, which
      # this step used to call "9.53 GB below the ceiling" while the database
      # was at 94% of the limit that actually applies to it. On a paid plan set
      # D1_TARGET_MB=5000 and D1_CEILING_MB=10000 here and the owner's original
      # "5 GB, never 10" is restored.
      - name: Check the size target and ceiling for this plan
        if: always()
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
        run: npx tsx scripts/d1-ceiling.ts
