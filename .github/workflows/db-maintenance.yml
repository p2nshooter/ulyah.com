name: D1 Maintenance (free space)

# The database filled up and stopped accepting writes.
#
# Cloudflare caps a D1 database at 500 MB on the Workers Free plan. ulyah-db
# reached 509.95 MB, and every write began failing — including the admin's own
# two-step verification, so the owner could not log in. Reads were unaffected,
# which is why the sites looked healthy while nothing could be saved.
#
# Two jobs, both run by hand, because freeing space is not something that
# should happen on a schedule without somebody watching:
#
#   prune-logs   deletes old key-pool validation rows. Pure churn, no content.
#   move-bodies  moves story bodies to R2 and leaves the key in D1.
#   prune-mt-ar  deletes machine translations made FROM Arabic — 69% of the
#                cache, and wrong: "عن أبي ذر" came out as "atas wewenang Abu
#                Dzar", "أم القرآن" as "Bunda Al-Qur'an". The reader falls back
#                to the curated hadits.text_id / text_en, which are sourced.
#                See scripts/prune-mt-arabic.ts for why this is a content fix
#                first and a space fix second.
#
# D1 writes go through wrangler here rather than through the dashboard or an
# API client, because that is this repository's normal path for them and it
# leaves a run log of exactly what was executed.
on:
  # Automatic, because a full D1 does not degrade — it stops. Every write
  # fails, the admin cannot log in, and the only warning is a red line in a
  # dialog. Owner: "D1 di jadiin write awal, klo penuh pindahin ke R2, dan
  # ngebacanya dari R2, begitu seterusnya, jd D1 selalu luas."
  #
  # Daily at 19:40 UTC (02:40 Jakarta) — off the hour so it does not collide
  # with the warm passes, and while the sites are quiet. The spill only acts
  # when the bulk in D1 is over the high-water mark, so on most days this
  # measures, says "D1 has room", and exits.
  schedule:
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        required: true
        type: choice
        options: [spill, prune-logs, move-bodies, prune-mt-arabic, both]
        default: spill
      budget:
        description: "Max rows to delete this run (free plan allows 100,000/day)"
        required: false
        default: "60000"
      limit:
        description: "How many story bodies to move this run"
        required: false
        default: "200"
      keep_days:
        description: "Days of key-validation log to keep"
        required: false
        default: "3"
      high_mb:
        description: "MB of story bodies in D1 that triggers a spill"
        required: false
        default: "40"
      low_mb:
        description: "MB to spill down to once triggered"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: db-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve provisioned resource IDs
        run: |
          set -eu
          CF="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          D1_ID=$(curl -sf -H "$AUTH" "$CF/d1/database?name=ulyah-db&per_page=100" | jq -r '.result[] | select(.name=="ulyah-db") | .uuid' | head -n1)
          KV_ID=$(curl -sf -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="ulyah-cache") | .id' | head -n1)
          sed -i "s/__D1_DATABASE_ID__/${D1_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__KV_NAMESPACE_ID__/${KV_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__R2_BUCKET_NAME__/ulyah-media/" apps/worker-api/wrangler.toml
          # The watermark reports the whole-file size alongside the bulk it
          # controls, and needs the id to ask for it.
          echo "D1_DATABASE_ID=${D1_ID}" >> "$GITHUB_ENV"

      - name: Size before
        if: always()
        run: |
          cd apps/worker-api
          npx wrangler d1 execute ulyah-db --remote --command="SELECT 'stories' t, COUNT(*) n, ROUND(SUM(LENGTH(body))/1048576.0,1) mib FROM stories WHERE body <> '' UNION ALL SELECT 'key_validation_log', COUNT(*), NULL FROM key_validation_log;"

      # Old key-pool validation rows. This table records whether a donated API
      # key answered a test — useful for a few days, meaningless after that,
      # and it had grown to 35,049 rows. Deleting them frees pages immediately;
      # SQLite reuses freed pages, so writes start working again without the
      # file having to shrink.
      # The watermark: measure, and spill to R2 only if there is too much bulk
      # sitting in D1. This is the step the schedule exists for.
      - name: Spill to R2 if D1 is filling up
        if: ${{ github.event_name == 'schedule' || inputs.job == 'spill' }}
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
        run: |
          npx tsx scripts/d1-watermark.ts \
            --high=${{ inputs.high_mb || '40' }} \
            --low=${{ inputs.low_mb || '15' }}

      - name: Prune the key validation log
        if: ${{ inputs.job == 'prune-logs' || inputs.job == 'both' }}
        run: |
          cd apps/worker-api
          npx wrangler d1 execute ulyah-db --remote \
            --command="DELETE FROM key_validation_log WHERE created_at < datetime('now','-${{ inputs.keep_days }} days');"

      # Machine translations made from Arabic. This is the one step that frees
      # space by removing something that should never have been stored, so it
      # needs no R2 round trip first — there is nothing here worth keeping.
      - name: Delete machine translations made from Arabic
        if: ${{ inputs.job == 'prune-mt-arabic' || inputs.job == 'both' }}
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
        run: npx tsx scripts/prune-mt-arabic.ts --budget=${{ inputs.budget || '60000' }}

      # Story bodies to R2. The script verifies every upload by reading it back
      # and comparing before it clears the column — see the note there.
      - name: Move story bodies to R2
        if: ${{ inputs.job == 'move-bodies' || inputs.job == 'both' }}
        run: npx tsx scripts/move-story-bodies-to-r2.ts --limit=${{ inputs.limit }}

      # `body_r2_key` only exists once migration 0054 has been applied, and the
      # deploy that applies it is itself blocked while D1 is full. Reporting is
      # not worth failing a run that just freed the space, so this step is
      # allowed to come back empty.
      - name: Size after
        if: always()
        continue-on-error: true
        run: |
          cd apps/worker-api
          npx wrangler d1 execute ulyah-db --remote --command="SELECT 'stories still in D1' t, COUNT(*) n, ROUND(SUM(LENGTH(body))/1048576.0,1) mib FROM stories WHERE body <> '';"
          npx wrangler d1 execute ulyah-db --remote --command="SELECT 'mt from Arabic (should be 0)' t, COUNT(*) n FROM mt_cache WHERE k LIKE 'mt:ar-__:%';"
