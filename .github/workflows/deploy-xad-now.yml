name: Deploy xad.es now (AdSense verification)

# One-off: publish xad.es with its new AdSense verification code today.
#
# The full deploy (deploy.yml) cannot run right now: its first D1 step reads
# the database, the account has spent today's free D1 read quota (code 7500),
# and the job stops before any worker is deployed. xad-web needs no D1 to
# build or deploy, so this builds the xad tenant and deploys that one worker.
#
# Runs when this file changes on this branch. Delete it once the branch is
# merged into main — deploy.yml then publishes the same code.

on:
  push:
    branches: [ccr-8cac35c6-6bbbvx]
    paths: [.github/workflows/deploy-xad-now.yml]

concurrency:
  group: deploy-xad-now
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-xad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Is R2 enabled on the account?
        run: |
          R2_OK=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets?per_page=1" | jq -r '.success // false' 2>/dev/null || echo false)
          echo "R2_OK=$R2_OK"
          echo "R2_OK=$R2_OK" >> "$GITHUB_ENV"

      # Same as deploy.yml: Cloudflare refuses to upload a Worker bound to R2
      # while R2 is off, and OpenNext refuses to build with an R2 page cache
      # whose binding is missing — so both go while R2 is disabled.
      - name: Leave R2 out while it is not enabled
        if: env.R2_OK != 'true'
        run: |
          set -eu
          python3 - <<'PYEOF'
          import pathlib, re
          web = pathlib.Path("apps/web/wrangler.jsonc")
          w = web.read_text()
          w2 = re.sub(r'\n\s*"r2_buckets"\s*:\s*\[.*?\]\s*,', '', w, flags=re.S)
          web.write_text(w2)
          print("web: R2 binding", "removed" if w2 != w else "not present")
          pathlib.Path("apps/web/open-next.config.ts").write_text(
              'import { defineCloudflareConfig } from "@opennextjs/cloudflare";\n'
              "\n"
              "// R2 is off on the account: no incremental cache (see deploy.yml).\n"
              "export default defineCloudflareConfig({});\n"
          )
          print("web: R2 page cache left out of the OpenNext build")
          PYEOF

      - name: Build xad.es (Next.js via OpenNext)
        working-directory: apps/web
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_API_URL: https://api.ulyah.com
          NEXT_PUBLIC_TENANT: "xad"

      - name: Deploy xad-web
        working-directory: apps/web
        run: npx wrangler deploy --name xad-web --var NEXT_INC_CACHE_R2_PREFIX:inc-xad

      - name: What xad.es serves now
        continue-on-error: true
        run: |
          sleep 15
          echo "--- https://xad.es/ads.txt"
          curl -s --max-time 30 "https://xad.es/ads.txt?v=$(date +%s)" || true
          echo
          echo "--- AdSense account on https://xad.es/ (meta tag + loader)"
          curl -s --max-time 30 -L "https://xad.es/?v=$(date +%s)" > /tmp/home.html || true
          grep -o 'google-adsense-account" content="[^"]*"' /tmp/home.html | sort -u || true
          grep -o 'adsbygoogle.js?client=ca-pub-[0-9]*' /tmp/home.html | sort -u || true
          echo "--- ad units in the page (must be 0): $(grep -c 'class="adsbygoogle' /tmp/home.html || true)"
