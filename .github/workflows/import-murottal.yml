name: Import murottal to R2 (complete the library)

# Fills the self-hosted murottal library in R2 to 100% for the chosen qori,
# so the radio + Qur'an reader can stream from R2 (free egress, edge-cached,
# can't be blocked like a third-party CDN). Runs on a GitHub runner because a
# whole-library import (up to 6236 ayat × 22 qori) far exceeds a Worker's
# subrequest/time budget. Idempotent + resumable — re-running only fetches the
# gaps, so start with one reciter, verify, then do the rest.
#
# HELD, and nothing reads what it writes. Owner: "live idn aja jgn download …
# hilangin audio2 alquran murottal ganti dengan cdn."
#
# The library this job fills is being DELETED: the Worker's scheduled tick drains
# audio/qori/ and audio/qori2/ out of R2 (see apps/worker-api/src/index.ts), the
# players fetch from the reciters' own CDNs, and /audio/qori2/… redirects there
# rather than serving bytes. So an import today would refill a bucket prefix that
# no page ever asks for.
#
# The reason is arithmetic: one reciter's complete per-ayah library is 6,236
# files, twenty-two reciters is ~137,000, and that is storage that only ever
# grows, for audio the source CDNs already serve for free.
#
# The tooling stays for the day a reciter's CDN goes dark and a mirror is worth
# having again — that is a decision with a route change behind it, not a click.
# `confirm` must say `download` or the job stops before fetching a single file.

on:
  workflow_dispatch:
    inputs:
      qori:
        description: "Comma list of R2 folders (e.g. alafasy,sudais) or 'all'"
        required: false
        default: "alafasy"
      limit:
        description: "Max ayat per qori this run (6236 = full)"
        required: false
        default: "6236"
      concurrency:
        description: "Parallel downloads"
        required: false
        default: "12"
      confirm:
        description: "Type 'download' to confirm — the library is otherwise streamed live, not stored"
        required: true
        default: ""

concurrency:
  group: import-murottal
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # The hold. Cheapest possible first step: nothing is checked out, no
      # runner minutes are spent, and the run's own log says why it stopped.
      - name: Confirm this import is wanted
        run: |
          if [ "${{ inputs.confirm }}" != "download" ]; then
            echo "::error::Murottal is streamed live from the reciters' CDNs (owner: \"live idn aja jgn download\")."
            echo "Re-run with confirm=download only if this library really has to be stored in R2."
            exit 1
          fi
          echo "Confirmed — importing into R2."

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install R2 S3 signer (aws4fetch)
        run: pnpm add -w --save-dev aws4fetch

      - name: Resolve provisioned resource IDs
        run: |
          set -eu
          CF="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          D1_ID=$(curl -sf -H "$AUTH" "$CF/d1/database?name=ulyah-db&per_page=100" | jq -r '.result[] | select(.name=="ulyah-db") | .uuid' | head -n1)
          KV_ID=$(curl -sf -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="ulyah-cache") | .id' | head -n1)
          sed -i "s/__D1_DATABASE_ID__/${D1_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__KV_NAMESPACE_ID__/${KV_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__R2_BUCKET_NAME__/ulyah-media/" apps/worker-api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Import
        run: node scripts/import-murottal.mjs --qori=${{ inputs.qori || 'alafasy' }} --limit=${{ inputs.limit || '6236' }} --concurrency=${{ inputs.concurrency || '12' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
