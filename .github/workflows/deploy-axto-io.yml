name: Deploy axto.io (NFT — repo p2nshooter/axto)

# Pemilik, 22 Nov 2026: situs NFT AXTO (lelang $1, koin AXTO, koleksi jam/prangko/Qur'an/model) menggantikan dashboard
# di axto.io („Ganti axto.io“). Dashboard guardian-ai tetap hidup di axto-dashboard.pages.dev.
#
# Repo p2nshooter/axto belum punya secret Cloudflare; jembatan ini memakai secret repo ini (pola yang sama dengan
# deploy-partner-sites.yml): checkout repo axto, uji, deploy worker `axto-web`, pindahkan domain axto.io & www dari
# Pages `axto-dashboard` ke worker, lalu cek live (AdSense 3 akun). Penyimpanan: R2 `axto-nft-data` saja (bukan D1;
# bucket `axto-data` milik dashboard tidak disentuh). KV `axto-nft-cache` hanya cache pendek & rate limit.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-axto-io.yml'
  schedule:
    - cron: '41 */6 * * *' # ikuti perubahan di repo axto tanpa sentuhan tangan

concurrency:
  group: deploy-axto-io
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout p2nshooter/axto
        uses: actions/checkout@v7
        with:
          repository: p2nshooter/axto

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Uji engine & worker
        run: |
          (cd engine && npm test)
          (cd worker && npm ci --no-audit --no-fund && npm test)

      - name: Vault & potret model (repo privat coinaxto, bila token bisa membacanya)
        id: vault
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
        run: |
          set -e
          [ -n "$GH_TOKEN" ] || { echo "GH_CONTENT_TOKEN tidak ada — vault dilewati"; exit 0; }
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/p2nshooter/coinaxto" /tmp/coinaxto || { echo "coinaxto tidak terbaca — vault dilewati"; exit 0; }
          cd /tmp/coinaxto && npm ci --no-audit --no-fund >/dev/null && npm test
          npx wrangler r2 bucket create axto-vault-data >/dev/null 2>&1 || true
          npx wrangler deploy
          printf '%s' "axto:VAULT_HMAC_KEY" | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" | awk '{print $NF}' | npx wrangler secret put VAULT_HMAC_KEY --name axto-vault >/dev/null
          npx wrangler r2 bucket create axto-nft-data >/dev/null 2>&1 || true
          for f in models/*/*.webp; do
            id=$(basename "$(dirname "$f")"); name=$(basename "$f")
            npx wrangler r2 object put "axto-nft-data/model/$id/$name" --file "$f" --content-type image/webp --remote >/dev/null
          done
          echo "- vault axto-vault + $(ls models/*/*.webp | wc -l) potret model (privat) ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: R2 & KV (idempoten)
        working-directory: worker
        run: |
          npx wrangler r2 bucket create axto-nft-data >/dev/null 2>&1 || echo "bucket axto-nft-data sudah ada"
          list() { npx wrangler kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const n=JSON.parse(s).find(x=>x.title==='axto-nft-cache');console.log(n?n.id:'')}catch{console.log('')}})"; }
          id=$(list)
          if [ -z "$id" ]; then npx wrangler kv namespace create axto-nft-cache >/dev/null; id=$(list); fi
          [ -n "$id" ] || { echo "::error::KV axto-nft-cache tidak bisa dibuat"; exit 1; }
          sed -i "s/REPLACE_WITH_KV_ID/$id/" wrangler.toml

      - name: Binding vault (lewati bila axto-vault belum ada) & domain dipasang lewat API
        working-directory: worker
        run: |
          python3 - <<'PY'
          import re, subprocess
          p = 'wrangler.toml'
          s = open(p, encoding='utf8').read()
          ok = subprocess.run(['npx', 'wrangler', 'deployments', 'list', '--name', 'axto-vault'], capture_output=True).returncode == 0
          if not ok:
              s = re.sub(r'\n\[\[services\]\]\nbinding = "VAULT"\nservice = "axto-vault"\nentrypoint = "Vault"\n', '\n', s)
              print('axto-vault belum ada — binding VAULT dilewati (fitur koin/klaim menunggu vault)')
          # domain dipasang setelah dilepas dari Pages (langkah berikut), bukan oleh wrangler
          s = re.sub(r'routes = \[[\s\S]*?\]\n', '', s, count=1)
          open(p, 'w', encoding='utf8').write(s)
          PY

      - name: Deploy worker axto-web
        working-directory: worker
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npx wrangler deploy 2>&1 | tee /tmp/deploy.log; then exit 0; fi
            grep -qiE "Invalid access token|code: ?9109|code: ?10000|Authentication error" /tmp/deploy.log && { echo "::error::token Cloudflare ditolak"; exit 1; }
            sleep $((attempt * 30))
          done
          exit 1

      - name: Rahasia worker (dibuat sekali; kunci HMAC diturunkan dari secret yang ada)
        working-directory: worker
        run: |
          have=$(npx wrangler secret list --name axto-web 2>/dev/null || echo '[]')
          for k in SESSION_KEY DATA_KEY; do
            echo "$have" | grep -q "\"$k\"" || { openssl rand -hex 32 | npx wrangler secret put "$k" --name axto-web >/dev/null && echo "dibuat $k"; }
          done
          for k in ENGINE_HMAC_KEY VAULT_HMAC_KEY; do
            printf '%s' "axto:$k" | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" | awk '{print $NF}' | npx wrangler secret put "$k" --name axto-web >/dev/null
          done

      - name: Pindahkan axto.io & www.axto.io ke worker axto-web
        run: |
          set -e
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          A="https://api.cloudflare.com/client/v4"
          zone=$(api "$A/zones?name=axto.io" | node -e "try{const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.result?.[0]?.id||'')}catch{}")
          [ -n "$zone" ] || { echo "::error::zona axto.io tidak terlihat oleh token ini"; exit 1; }
          for host in axto.io www.axto.io; do
            api -X DELETE "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/axto-dashboard/domains/$host" >/dev/null || true
            for type in A AAAA CNAME; do
              for id in $(api "$A/zones/$zone/dns_records?type=$type&name=$host" | node -e "try{const d=JSON.parse(require('fs').readFileSync(0,'utf8'));(d.result||[]).forEach(r=>console.log(r.id))}catch{}"); do
                api -X DELETE "$A/zones/$zone/dns_records/$id" >/dev/null && echo "hapus $type $host"
              done
            done
            r=$(api -X PUT -d "{\"hostname\":\"$host\",\"zone_id\":\"$zone\",\"service\":\"axto-web\",\"environment\":\"production\"}" "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
            echo "$r" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));if(!d.success){console.log(JSON.stringify(d.errors));process.exit(1)};console.log('terpasang',d.result.hostname)"
          done

      - name: Cek live (AdSense 3 akun, ads.txt, halaman, metadata)
        run: |
          for i in $(seq 1 20); do
            ads=$(curl -sf https://axto.io/ads.txt || true)
            [ "$(echo "$ads" | grep -c '^google.com, pub-')" = "3" ] && break
            sleep 15
          done
          for p in 6560360898389273 4906992051458194 5928074389292014; do
            echo "$ads" | grep -qx "google.com, pub-$p, DIRECT, f08c47fec0942fa0" || { echo "::error::ads.txt pub-$p hilang"; echo "$ads"; exit 1; }
          done
          home=$(curl -sfL https://axto.io/en)
          for p in 6560360898389273 4906992051458194 5928074389292014; do
            echo "$home" | grep -q "name=\"google-adsense-account\" content=\"ca-pub-$p\"" || { echo "::error::meta ca-pub-$p hilang"; exit 1; }
          done
          [ "$(echo "$home" | grep -o 'adsbygoogle.js?client=' | wc -l)" = "1" ] || { echo "::error::harus tepat satu loader"; exit 1; }
          curl -sf https://axto.io/api/meta/time/1 | grep -q '"name"'
          {
            echo "## axto.io live ✅"
            echo "- Loader: ca-pub-5928074389292014 · meta: 3 akun · ads.txt: 3 baris"
          } >> "$GITHUB_STEP_SUMMARY"
