name: Warm Translation Cache (kisah taxonomy)

# Pre-translates the short taxonomy strings the sibling sites render — category
# names + the kisah "tokoh" person index (name + honorific) + story titles —
# and writes them into the SAME KV cache the Worker reads. The Worker's runtime
# Google-translate calls are blocked from Cloudflare IPs, so those strings fell
# back to Indonesian on 1fr.fr/dawa.es/tilawa.de/xad.es; a GitHub Actions runner
# is not blocked, so it can fill the cache once and let the Worker serve the
# translation with no upstream call. Idempotent bulk write, safe to re-run.

on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Comma-separated target languages (blank = all ecosystem languages)"
        required: false
        default: ""
      one:
        description: "Warm ONE language this run, then chain to the next (recommended)"
        required: false
        type: boolean
        default: true
      chain:
        description: "Re-dispatch this workflow when the pass finishes and work remains"
        required: false
        type: boolean
        default: true
  schedule:
    # Every three hours, not once at night. A single nightly pass could never
    # close the gap: the twenty-two switched-off languages were 15,000 strings
    # each behind French, and one pass tops up only what it has time for
    # (owner: "bikin warm nyambung terus jangan cuma malam"). The runs also
    # chain — see the last step — so this schedule is really just a safety net
    # in case a chain ever breaks.
    - cron: "45 */3 * * *"
  # Run automatically after every successful deploy, so content added and
  # imported by that deploy gets its sibling-language translations right away
  # instead of waiting for the nightly run. The script skips strings already in
  # the D1 mt_cache, so an unchanged corpus costs zero upstream calls — only
  # genuinely new content is translated. (default branch is main, so this
  # registers correctly.)
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]

# Queue rather than cancel, so a long warm always finishes — but keep each
# TRIGGER in its own lane.
#
# With a single shared lane the after-every-deploy runs starved everything
# else: on a busy day (~20 deploys) each new deploy-triggered run cancelled the
# one still queued, and the nightly full pass was cancelled along with them. In
# 26 runs only 3 ever completed, and none for ~18 hours, which is exactly why
# the newer languages stayed at ~600 cached strings while French sat at 11k.
#
# Per-event groups mean the scheduled full pass and a manual dispatch can never
# be cancelled by deploy churn. Concurrent lanes are safe: the script is
# idempotent (INSERT … ON CONFLICT) and skips anything already in D1, so the
# worst case is a little duplicated lookup work.
concurrency:
  group: warm-mt-cache-${{ github.event_name }}
  cancel-in-progress: false

# contents: the readiness re-measurement step commits the updated numbers back.
# actions:  the last step re-dispatches this workflow to continue the warming.
permissions:
  contents: write
  actions: write

jobs:
  warm:
    runs-on: ubuntu-latest
    # Below GitHub's 6-hour kill, and above the script's own 4-hour translate
    # budget plus the write, the re-measure and the commit that follow it. The
    # script is meant to stop itself and bank its work; this is only the outer
    # bound, so a hang ends as a clean timeout rather than at the platform cap.
    timeout-minutes: 330
    # workflow_run fires on ANY completion — only warm after a SUCCESSFUL deploy
    # (a failed/cancelled deploy didn't import new content worth warming). Manual
    # dispatch and the nightly schedule always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The readiness step commits back, so keep the token that can push.
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve provisioned resource IDs
        run: |
          set -eu
          CF="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          D1_ID=$(curl -sf -H "$AUTH" "$CF/d1/database?name=ulyah-db&per_page=100" | jq -r '.result[] | select(.name=="ulyah-db") | .uuid' | head -n1)
          KV_ID=$(curl -sf -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="ulyah-cache") | .id' | head -n1)
          sed -i "s/__D1_DATABASE_ID__/${D1_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__KV_NAMESPACE_ID__/${KV_ID}/" apps/worker-api/wrangler.toml
          sed -i "s/__R2_BUCKET_NAME__/ulyah-media/" apps/worker-api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Warm the MT cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Unlocks the donated AI key pool: the keys live encrypted in D1 and
          # this is the only thing that can read them. Absent (a fork, a repo
          # without the secret) the script says so and translates with gtx
          # alone — the behaviour this job had before the pool existed.
          KEY_ENCRYPTION_SECRET: ${{ secrets.KEY_ENCRYPTION_SECRET }}
        # Empty langs (schedule / workflow_run / blank dispatch) → the script's
        # own default: every ecosystem language.
        #
        # ONE language per run (owner: "bikin per bahasa dulu jgn langsung, per
        # bahasa bisa saling nyambung"). A pass that tried all 26 spread its wall
        # clock across all of them and finished none; one language per run
        # finishes that language and chains into the next.
        #
        # Order is "utamain yg saat ini di pakai dulu": the sites with live
        # readers first (de 49%, es 72%, en 83%), then the switched-off ones.
        #
        # The script prints WARM_NEXT=<remaining> — the chaining step reads it
        # rather than re-deriving the queue, so the two can never disagree.
        run: |
          set -o pipefail
          npx tsx scripts/warm-mt-cache.ts \
            --langs=${{ inputs.langs }} \
            ${{ (github.event_name != 'workflow_dispatch' || inputs.one) && '--one' || '' }} \
            | tee /tmp/warm.log
          # Keep the run's own answer. Absent (a mode that does not print it)
          # is deliberately NOT the same as present-and-empty: the first means
          # "unknown", the second means "finished", and treating them alike
          # would silently stop the chain.
          grep -E '^WARM_NEXT=' /tmp/warm.log | tail -1 > /tmp/warm-next.txt || true

      # Close the loop: re-measure how much of the site's writing now exists in
      # each language and regenerate the readiness table. A language that has
      # reached 100% unlocks itself on the next deploy instead of waiting for
      # somebody to notice — which is the whole point of gating on a measurement
      # rather than on a hand-kept list.
      # Kept so the chaining step below can tell whether this pass actually
      # moved anything, and refuse to chain into a loop that is achieving
      # nothing (Google occasionally rate-limits the runner).
      - name: Snapshot coverage before re-measuring
        if: ${{ !cancelled() }}
        run: cp scripts/locale-content.json /tmp/locale-content.before.json

      # `!cancelled()` rather than the default success-only, and this is the
      # reason the admin's language bars were wrong: the measurement runs AFTER
      # the warm step, so every warm failure skipped it, and the numbers on
      # screen were the last ones a SUCCESSFUL run happened to leave behind.
      # With warm failing for months, "de 49%" was measured against a corpus
      # five times smaller than the one in D1 today.
      #
      # The measurement reads D1 directly and does not care whether warming
      # went well — a failed pass still moved the numbers, and a bar that only
      # updates on success is a bar that lies exactly when it matters.
      - name: Re-measure language readiness
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx tsx scripts/measure-locale-content.ts
          npx tsx scripts/generate-locale-readiness.ts
          # A language that just reached 100% needs its translations in the
          # bundle — the shipped table carries only the languages we serve.
          npx tsx scripts/generate-ui-i18n.ts

      - name: Commit the new readiness measurement
        if: ${{ !cancelled() }}
        run: |
          set -eu
          if git diff --quiet -- scripts/locale-content.json packages/shared/src/locale-readiness.gen.ts \
                                 scripts/ui-i18n-full.json apps/web/src/lib/ui-i18n.gen.ts; then
            echo "No change in language readiness."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/locale-content.json packages/shared/src/locale-readiness.gen.ts \
                  scripts/ui-i18n-full.json apps/web/src/lib/ui-i18n.gen.ts
          git commit -m "chore(i18n): re-measure language readiness after warming"
          # The earlier "Resolve provisioned resource IDs" step sed-edits
          # apps/worker-api/wrangler.toml IN PLACE (it substitutes real
          # D1/KV/R2 IDs so `wrangler d1 execute` works) — a tracked file, left
          # modified for the rest of the job. That was harmless while this
          # rebase had nothing to actually replay. Today it did: several warm
          # passes (schedule, workflow_run, this dispatch) were racing and
          # pushing to main around the same time, so a real rebase became
          # necessary, and git refused with "cannot pull with rebase: you have
          # unstaged changes" — failing the commit and, with it, the whole run.
          # The substituted file was never meant to be committed, so discard it
          # before rebasing rather than the other way round.
          git checkout -- apps/worker-api/wrangler.toml
          git pull --rebase origin main
          git push origin HEAD:main

      # Keep going until the work is done (owner: "klo sudah selesai satu
      # nyambung lg"). One pass can only translate what fits in its wall clock,
      # and the switched-off languages were ~15,000 strings each behind French —
      # so a pass that ends with work left over starts the next one itself.
      #
      # Two brakes, so this can never become a hot loop:
      #   · nobody behind  → the job is finished; stop and say so;
      #   · no progress    → the previous pass gained nothing (rate limit,
      #                      upstream block). Chaining again would just burn
      #                      minutes, so stop and let the 3-hourly schedule
      #                      retry with fresh luck.
      #
      # workflow_dispatch is one of the two events GitHub still delivers when
      # raised with GITHUB_TOKEN, so the chain is allowed to exist at all.
      # Deploy-triggered runs never chain: they exist to catch up new content,
      # not to start a campaign.
      - name: Chain the next pass
        if: ${{ github.event_name != 'workflow_run' && (github.event_name != 'workflow_dispatch' || inputs.chain) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # WARM_NEXT is empty only when every language has reached parity. It is
          # the script's own answer, so the chain follows exactly what was warmed
          # rather than a second guess at the queue.
          if [ -s /tmp/warm-next.txt ]; then
            next=$(sed -n 's/^WARM_NEXT=//p' /tmp/warm-next.txt)
            known=1
          else
            next=""
            known=0
          fi
          decision=$(WARM_NEXT="$next" WARM_NEXT_KNOWN="$known" node -e '
            const fs = require("fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")).rows ?? {}; } catch { return {}; } };
            const before = read("/tmp/locale-content.before.json");
            const after  = read("scripts/locale-content.json");
            const sum = (o) => Object.values(o).reduce((a, b) => a + Number(b), 0);
            const gained = sum(after) - sum(before);
            const best = Math.max(0, ...Object.values(after).map(Number));
            // The queue the run itself reported, not a re-derivation — so the
            // chain follows exactly what was warmed. When the run did not report
            // one at all, fall back to the measurement rather than assuming the
            // job is finished.
            const known = process.env.WARM_NEXT_KNOWN === "1";
            const remaining = (process.env.WARM_NEXT || "").split(",").filter(Boolean);
            const pct = (n) => best ? Math.round((Number(n) / best) * 100) : 0;
            const shortFromMeasure = Object.entries(after)
              .filter(([, n]) => Number(n) < best * 0.99)
              .sort((a, b) => Number(a[1]) - Number(b[1]));
            console.error(`gained ${gained} strings this pass; corpus is ${best}`);
            console.error(
              known
                ? `still queued: ${remaining.length} — ${remaining.slice(0, 8).join(", ")}`
                : `queue not reported; ${shortFromMeasure.length} language(s) short by measurement`
            );
            for (const [l, n] of shortFromMeasure.slice(0, 5)) console.error(`  lowest: ${l} ${n} (${pct(n)}%)`);
            const left = known ? remaining.length : shortFromMeasure.length;
            if (left === 0) console.log("done");
            else if (gained <= 0) console.log("stalled");
            else console.log("chain");
          ')
          case "$decision" in
            done)
              echo "Every language has reached parity — nothing left to warm." ;;
            stalled)
              echo "::warning::This pass gained no new translations; not chaining. The 3-hourly schedule will retry." ;;
            chain)
              echo "Work remains — starting the next pass."
              gh workflow run warm-mt-cache.yml --ref main -f langs= -f one=true -f chain=true ;;
          esac
