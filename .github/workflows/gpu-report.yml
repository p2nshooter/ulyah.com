name: Laporan kunci GPU (ringkasan, tanpa rahasia)

# Read-only. Owner, 22–23 Nov 2026: "cek jg setiap key gpu yg ada d portal admin, apakah masih aktif dan bisa di test
# untuk membuat sebagian animasi axto.io" — and the GPU collections for axto.io wait on that answer. The Worker writes
# the check to R2 (c/gpu_check/latest.json: daily, and whenever an admin presses the button); this prints only counts
# per provider and verdict — never a key, never a donor's name.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ulyah-media
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Summarise the latest GPU check
        run: |
          set -o pipefail
          npx tsx scripts/gpu-report.ts | tee /tmp/gpu.txt
          { echo "### Kunci GPU"; sed 's/^/    /' /tmp/gpu.txt; } >> "$GITHUB_STEP_SUMMARY"
